name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bff-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify staging scene export toggle
        run: node --test scripts/configure-staging-scene-export.test.mjs

      - name: Verify body initializer deployment regression
        run: node --test scripts/refresh-body-init-image.test.mjs

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Validate production image
        run: |
          docker buildx build --platform linux/arm64 --tag standin-bff:ci --load .
          docker run --rm --platform linux/arm64 --entrypoint node standin-bff:ci --input-type=module -e "await import('@aws-sdk/client-s3'); console.log('Body initializer S3 runtime available')"
