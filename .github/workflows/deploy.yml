name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      scene_export_enabled:
        description: "Enable integrated FBX export for this staging deployment"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  # 환경별로 나눈다 — staging 배포가 진행 중인 프로덕션 배포를 막지 않는다.
  group: deploy-bff-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ECR_REPOSITORY: standin/bff

jobs:
  deploy:
    name: Deploy
    if: vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # main만 프로덕션이다. 그 외 브랜치는 전부 staging으로 간다.
    environment: ${{ github.ref == 'refs/heads/main' && 'beta' || 'staging' }}
    env:
      # ⚠ 이 값들은 **job 레벨**에 있어야 한다. 워크플로 레벨 env의 vars는
      #   environment 변수를 보지 못하고 저장소 변수(프로덕션 값)만 읽는다 —
      #   거기 두면 staging 배포가 프로덕션 클러스터로 나간다.
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE }}
      # A manual false must override a previously enabled environment variable.
      STAGING_SCENE_EXPORT_ENABLED: ${{ github.event_name == 'workflow_dispatch' && (inputs.scene_export_enabled && 'true' || 'false') || (vars.SCENE_EXPORT_ENABLED == 'true' && 'true' || 'false') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test and build
        run: |
          npm ci
          node --test scripts/configure-staging-scene-export.test.mjs
          npm run typecheck
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # ⚠ 움직이는 태그는 브랜치마다 나눈다 — main은 `latest`, develop은 `develop`.
          #
          # 저장소를 두 환경이 공유하고, 프로덕션 CDK 태스크 정의가 `:latest`를
          # 참조한다. develop 빌드가 `latest`를 옮기면, 그 뒤 누군가 돌린
          # `cdk deploy StandinApp`이 서비스를 CDK 리비전으로 되돌리면서
          # **develop 코드를 프로덕션에 올린다**. SHA 태그는 항상 푸시한다 —
          # 배포는 그쪽을 쓴다. 움직이는 태그는 `cdk deploy`가 서비스를 되돌릴 때
          # 어느 이미지로 수렴할지를 정한다(Standin-infra의 imageTag 컨텍스트).
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}:latest', steps.ecr.outputs.registry, env.ECR_REPOSITORY) || '' }}
            ${{ github.ref == 'refs/heads/develop' && format('{0}/{1}:develop', steps.ecr.outputs.registry, env.ECR_REPOSITORY) || '' }}
          # 로그의 version 필드가 된다. 이미지에 구워야 cdk deploy가 돌아도 남는다.
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download current task definition
        run: |
          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          test "$TASK_DEFINITION" != "None"
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION" \
            --query taskDefinition > taskdef.json

      # Staging only. Individual FBX export remains enabled when scenes are off.
      - name: Configure integrated FBX export in staging
        if: github.ref != 'refs/heads/main'
        run: node scripts/configure-staging-scene-export.mjs taskdef.json

      - name: Refresh BFF body initializer runtime
        env:
          DEPLOY_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
        run: node scripts/refresh-body-init-image.mjs taskdef.json "$DEPLOY_IMAGE" bff

      # REVIEW_WITHOUT_QUALITY_CONSENT: 관리자 열람을 품질 동의와 분리하는 스위치. 환경(staging·beta)의
      #   변수가 'true'일 때만 켜지고, 없거나 다른 값이면 false다. 뷰는 시작할 때마다 다시 만들어지므로
      #   BFF와 worker가 같은 값을 받아야 한다 — 다르면 나중에 뜬 쪽이 범위를 덮어쓴다.
      # DEPLOYMENT_VERSION: 이미지에도 구워 두지만 태스크 정의 env가 이미지 ENV를 덮어쓴다. 손으로 등록한
      #   리비전에 옛 값이 남으면(staging 2026-10-17, ee2e9a1) 배포마다 그대로 복사돼 로그 version과
      #   썸네일 캐시 키(POSE_THUMBNAIL_REVISION 기본값)가 멈춘다. 배포 때마다 실제 커밋으로 덮어쓴다.
      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: taskdef.json
          container-name: bff
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
          environment-variables: |
            HAND_SELECTION_ENABLED=${{ vars.HAND_SELECTION_ENABLED || 'false' }}
            SEMANTIC_SEARCH_ENABLED=${{ vars.SEMANTIC_SEARCH_ENABLED || 'false' }}
            SEMANTIC_SEARCH_PER_MINUTE=${{ vars.SEMANTIC_SEARCH_PER_MINUTE || '10' }}
            SEMANTIC_SEARCH_TIMEOUT_MS=${{ vars.SEMANTIC_SEARCH_TIMEOUT_MS || '30000' }}
            DEPLOYMENT_VERSION=${{ github.sha }}
            REVIEW_WITHOUT_QUALITY_CONSENT=${{ vars.REVIEW_WITHOUT_QUALITY_CONSENT == 'true' && 'true' || 'false' }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Download worker task definition
        if: env.ECS_WORKER_SERVICE != ''
        run: |
          WORKER_TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_WORKER_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          test "$WORKER_TASK_DEFINITION" != "None"
          aws ecs describe-task-definition \
            --task-definition "$WORKER_TASK_DEFINITION" \
            --query taskDefinition > worker-taskdef.json

      - name: Refresh worker body initializer runtime
        if: env.ECS_WORKER_SERVICE != ''
        env:
          DEPLOY_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
        run: node scripts/refresh-body-init-image.mjs worker-taskdef.json "$DEPLOY_IMAGE" analysis-worker

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        if: env.ECS_WORKER_SERVICE != ''
        id: render_worker
        with:
          task-definition: worker-taskdef.json
          container-name: analysis-worker
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
          environment-variables: |
            HAND_SELECTION_ENABLED=${{ vars.HAND_SELECTION_ENABLED || 'false' }}
            SEMANTIC_SEARCH_ENABLED=${{ vars.SEMANTIC_SEARCH_ENABLED || 'false' }}
            SEMANTIC_SEARCH_PER_MINUTE=${{ vars.SEMANTIC_SEARCH_PER_MINUTE || '10' }}
            SEMANTIC_SEARCH_TIMEOUT_MS=${{ vars.SEMANTIC_SEARCH_TIMEOUT_MS || '30000' }}
            DEPLOYMENT_VERSION=${{ github.sha }}
            REVIEW_WITHOUT_QUALITY_CONSENT=${{ vars.REVIEW_WITHOUT_QUALITY_CONSENT == 'true' && 'true' || 'false' }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        if: env.ECS_WORKER_SERVICE != ''
        with:
          task-definition: ${{ steps.render_worker.outputs.task-definition }}
          service: ${{ env.ECS_WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

