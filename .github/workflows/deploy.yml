name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  # 환경별로 나눈다 — staging 배포가 진행 중인 프로덕션 배포를 막지 않는다.
  group: deploy-bff-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ECR_REPOSITORY: standin/bff

jobs:
  deploy:
    name: Deploy
    if: vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # main만 프로덕션이다. 그 외 브랜치는 전부 staging으로 간다.
    environment: ${{ github.ref == 'refs/heads/main' && 'beta' || 'staging' }}
    env:
      # ⚠ 이 값들은 **job 레벨**에 있어야 한다. 워크플로 레벨 env의 vars는
      #   environment 변수를 보지 못하고 저장소 변수(프로덕션 값)만 읽는다 —
      #   거기 두면 staging 배포가 프로덕션 클러스터로 나간다.
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test and build
        run: |
          npm ci
          npm run typecheck
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # 로그의 version 필드가 된다. 이미지에 구워야 cdk deploy가 돌아도 남는다.
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download current task definition
        run: |
          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          test "$TASK_DEFINITION" != "None"
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION" \
            --query taskDefinition > taskdef.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: taskdef.json
          container-name: bff
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Download worker task definition
        if: env.ECS_WORKER_SERVICE != ''
        run: |
          WORKER_TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_WORKER_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          test "$WORKER_TASK_DEFINITION" != "None"
          aws ecs describe-task-definition \
            --task-definition "$WORKER_TASK_DEFINITION" \
            --query taskDefinition > worker-taskdef.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        if: env.ECS_WORKER_SERVICE != ''
        id: render_worker
        with:
          task-definition: worker-taskdef.json
          container-name: analysis-worker
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        if: env.ECS_WORKER_SERVICE != ''
        with:
          task-definition: ${{ steps.render_worker.outputs.task-definition }}
          service: ${{ env.ECS_WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
